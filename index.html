<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0a0a15;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#15152a;border:1px solid #2a2a4a;border-radius:16px;padding:30px 24px}
.logo{text-align:center;font-size:18px;letter-spacing:4px;margin-bottom:6px;color:#a78bfa}
.tag{text-align:center;font-size:10px;letter-spacing:3px;color:#666;margin-bottom:24px}
input{width:100%;padding:14px;background:#0a0a15;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
input:focus{border-color:#7c5cff}
button{width:100%;padding:14px;background:linear-gradient(135deg,#7c5cff,#ec4899);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase}
button:disabled{opacity:.5}
.msg{text-align:center;font-size:12px;margin-top:14px;color:#888;min-height:18px}
.msg.err{color:#f87171}
.msg.ok{color:#34d399}
.result{background:#0a0a15;border:1px solid #2a2a4a;border-radius:10px;padding:16px;margin-top:16px}
.result .row{padding:8px 0;border-bottom:1px solid #1a1a2e;font-size:13px}
.result .row:last-child{border:none}
.result .k{color:#22d3ee;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.result .v{color:#fff;margin-top:4px;word-break:break-word}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ</div>
  <div class="tag" id="tag">ACCESS CONTROL</div>

  <!-- LOGIN -->
  <div id="pg-login">
    <input type="password" id="loginKey" placeholder="Enter key" autocomplete="off"/>
    <button onclick="login()">UNLOCK</button>
    <div class="msg" id="loginMsg">Waiting...</div>
  </div>

  <!-- SEARCH -->
  <div id="pg-search" class="hide">
    <input type="tel" id="numInput" placeholder="03xxxxxxxx" maxlength="11"/>
    <button onclick="search()">GET DATA</button>
    <div class="msg" id="searchMsg"></div>
    <div id="resultArea"></div>
    <button onclick="logout()" style="background:#2a2a4a;margin-top:12px">BACK</button>
  </div>

  <!-- API TOKEN -->
  <div id="pg-api" class="hide">
    <input type="text" id="apiToken" placeholder="Enter token"/>
    <button onclick="saveToken('api')">SAVE TOKEN</button>
    <div class="msg" id="apiMsg"></div>
    <button onclick="logout()" style="background:#2a2a4a;margin-top:12px">BACK</button>
  </div>

  <!-- TOKEN -->
  <div id="pg-token" class="hide">
    <input type="text" id="tokInput" placeholder="Enter token"/>
    <button onclick="saveToken('tok')">SAVE TOKEN</button>
    <div class="msg" id="tokMsg"></div>
    <button onclick="logout()" style="background:#2a2a4a;margin-top:12px">BACK</button>
  </div>

  <!-- MAINTENANCE -->
  <div id="pg-maint" class="hide">
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:40px">🛠</div>
      <div style="margin-top:14px;font-size:14px;letter-spacing:2px;color:#fbbf24">MAINTENANCE</div>
      <div style="margin-top:8px;font-size:12px;color:#888">Site under maintenance</div>
    </div>
    <button onclick="bootCheck()">RETRY</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LS = 'nm_cfg';

function cfg(){ try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}} }
function save(c){ localStorage.setItem(LS, JSON.stringify(c)) }

function show(id){
  ['pg-login','pg-search','pg-api','pg-token','pg-maint'].forEach(p=>{
    $(p).classList.toggle('hide', p !== id);
  });
}

async function verify(key){
  try{
    const r = await fetch('/?key=' + encodeURIComponent(key));
    return await r.json();
  }catch(e){ return null }
}

async function maintCheck(){
  try{
    const r = await fetch('/maintenance-status');
    const d = await r.json();
    return !!d.active;
  }catch(e){ return false }
}

async function bootCheck(){
  show('pg-maint');
  const on = await maintCheck();
  if(on){ return }   // maintenance screen pe hi raho
  show('pg-login');
  $('loginMsg').textContent = 'Waiting...';
}

async function login(){
  const k = $('loginKey').value.trim();
  const msg = $('loginMsg');
  if(!k){ msg.textContent='Enter key'; msg.className='msg err'; return }
  msg.textContent='Verifying...'; msg.className='msg';
  const d = await verify(k);
  if(!d || d.status !== 'verified'){
    msg.textContent='Wrong key'; msg.className='msg err';
    return;
  }
  msg.textContent='✓ Welcome ' + (d.name || k); msg.className='msg ok';
  const n = String(d.name || '').toLowerCase();
  setTimeout(()=>{
    $('loginKey').value = '';
    if(n === 'api'){ show('pg-api'); $('apiToken').value='' }
    else if(n === 'token'){ show('pg-token'); $('tokInput').value=cfg().token||'' }
    else{ show('pg-search'); $('numInput').value=''; $('resultArea').innerHTML='' }
  }, 500);
}

async function saveToken(type){
  const id = type === 'api' ? 'apiToken' : 'tokInput';
  const mid = type === 'api' ? 'apiMsg' : 'tokMsg';
  const v = $(id).value.trim();
  const msg = $(mid);
  if(!v){ msg.textContent='Empty'; msg.className='msg err'; return }
  msg.textContent='Saving...'; msg.className='msg';
  try{
    const r = await fetch('/admin/token', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Token':v},
      body: JSON.stringify({token:v})
    });
    const d = await r.json();
    if(d.success){
      const c = cfg(); c.token = v; save(c);
      msg.textContent='✓ Saved'; msg.className='msg ok';
    } else {
      msg.textContent='✕ ' + (d.error||'failed'); msg.className='msg err';
    }
  }catch(e){
    msg.textContent='✕ Error'; msg.className='msg err';
  }
}

async function search(){
  const num = $('numInput').value.trim();
  const msg = $('searchMsg');
  const area = $('resultArea');
  if(num.length < 10){ msg.textContent='Invalid number'; msg.className='msg err'; return }
  msg.textContent='Searching...'; msg.className='msg';
  area.innerHTML = '';
  try{
    const r = await fetch('/proxy-search?query=' + encodeURIComponent(num));
    const d = await r.json();
    if(!d || d.success === false || !d.data || !d.data[0]){
      msg.textContent='✕ Data not found'; msg.className='msg err';
      return;
    }
    msg.textContent='✓ Found'; msg.className='msg ok';
    const it = d.data[0];
    const rows = [
      ['Name', it.name || 'N/A'],
      ['Mobile', it.mobile || 'N/A'],
      ['CNIC', it.cnic || 'N/A'],
      ['Address', it.address || 'N/A'],
      ['Num2Name', it.Num2Name || 'N/A']
    ];
    let h = '<div class="result">';
    rows.forEach(([k,v])=>{
      h += `<div class="row"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;
    });
    h += '</div>';
    area.innerHTML = h;
  }catch(e){
    msg.textContent='✕ Error'; msg.className='msg err';
  }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

function logout(){
  $('loginKey').value = '';
  $('loginMsg').textContent = 'Waiting...';
  $('loginMsg').className = 'msg';
  show('pg-login');
}

$('loginKey').addEventListener('keydown', e => { if(e.key==='Enter') login() });
$('numInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,11) });
$('numInput').addEventListener('keydown', e => { if(e.key==='Enter') search() });

window.addEventListener('load', ()=> setTimeout(bootCheck, 500));
</script>
</body>
</html>
